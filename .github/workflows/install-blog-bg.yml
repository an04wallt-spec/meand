name: Install exact blog background
on:
  push:
    paths:
      - '.bgchunks/**'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact uploaded image
        shell: bash
        run: |
          set -e
          for i in $(seq -w 0 19); do
            test -f ".bgchunks/$i.b64" || exit 0
          done
          cat .bgchunks/*.b64 | tr -d '\n\r ' | base64 -d > blog-bg.jpg
          test "$(wc -c < blog-bg.jpg)" -eq 172260
          test "$(sha256sum blog-bg.jpg | awk '{print $1}')" = "2dcf48a257601636f70dd53eb185ab3e4d5f1ad836dc0a469aa459e4ed644663"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("blog.html")
          s=p.read_text(encoding="utf-8")
          import re
          s=re.sub(r'--blog-bg:url\("[^"]*"\);','--blog-bg:url("/blog-bg.jpg?v=exact-82461");',s,count=1)
          p.write_text(s,encoding="utf-8")
          PY
          rm -rf .bgchunks
          rm -f blog-bg.svg blog-bg-upload.b64 blog-bg-chunk02.b64 blog-bg-chunk03.b64 blog-bg-chunk04.b64 blog-bg-chunk05.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use exact uploaded image as blog background"
          git push
