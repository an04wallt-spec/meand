name: Import Metro audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-metro.yml'

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Metro audio
        env:
          FILE_URL: "/mnt/data/metro-128.mp3"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$FILE_URL" -o metro-128.mp3
          test -s metro-128.mp3
          file metro-128.mp3

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metro-128.mp3
          git commit -m "Add Metro audio for site player"
          git push
