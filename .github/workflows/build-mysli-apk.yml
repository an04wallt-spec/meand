name: Build Mysli APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/blog-publisher/**'
      - '.github/workflows/build-mysli-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed APK
        working-directory: android/blog-publisher
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android/blog-publisher/app/build/outputs/apk/release/app-release.apk Mysli.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mysli
          path: Mysli.apk
          if-no-files-found: error
