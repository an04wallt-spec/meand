<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2800" viewBox="0 0 1920 2800" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#321d15"/>
      <stop offset="0.24" stop-color="#24130e"/>
      <stop offset="0.62" stop-color="#170d0a"/>
      <stop offset="1" stop-color="#0c0706"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="-3%" r="82%">
      <stop offset="0" stop-color="#8f5a3c" stop-opacity=".34"/>
      <stop offset=".22" stop-color="#6f432f" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#321b14" stop-opacity=".08"/>
      <stop offset="1" stop-color="#090504" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="28%" r="78%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <filter id="velvet" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .12" numOctaves="3" seed="41" stitchTiles="stitch" result="fibres"/>
      <feColorMatrix in="fibres" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softFibres">
        <feFuncR type="gamma" amplitude="1.1" exponent="1.45" offset="-.08"/>
        <feFuncG type="gamma" amplitude="1.1" exponent="1.45" offset="-.08"/>
        <feFuncB type="gamma" amplitude="1.1" exponent="1.45" offset="-.08"/>
        <feFuncA type="table" tableValues="0 .19"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softFibres" mode="soft-light"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .07"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="2800" fill="url(#base)"/>
  <rect width="1920" height="2800" fill="url(#light)"/>
  <g filter="url(#velvet)" opacity=".78">
    <rect x="-40" y="-40" width="2000" height="2880" fill="#6f4431" opacity=".17"/>
  </g>
  <rect width="1920" height="2800" fill="#fff" filter="url(#grain)" opacity=".42"/>
  <rect width="1920" height="2800" fill="url(#vignette)"/>
</svg>