<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact — MeAND</title>
<link rel="canonical" href="https://meand.ru/contact.html">
<link rel="icon" type="image/png" href="/Favicon.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Official website contact page for Meand / Andrey Panov.">
<style>
:root{
  --main-dark:#080503;
  --warm:#b88962;
  --text:#f1eee9;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--main-dark);
  color:var(--text);
}
body{
  font-family:Georgia,"Times New Roman",serif;
}
.page{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:var(--main-dark);
}
.artboard{
  position:absolute;
  z-index:1;
  right:0;
  top:50%;
  height:100vh;
  height:100dvh;
  aspect-ratio:9/16;
  transform:translateY(-50%);
}
.artwork{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  pointer-events:none;
  user-select:none;
  opacity:.70;
  filter:brightness(.82) saturate(.78) contrast(.92);
  -webkit-mask-image:linear-gradient(
    to right,
    transparent 0%,
    transparent 5%,
    rgba(0,0,0,.02) 10%,
    rgba(0,0,0,.07) 15%,
    rgba(0,0,0,.16) 20%,
    rgba(0,0,0,.30) 25%,
    rgba(0,0,0,.48) 30%,
    rgba(0,0,0,.68) 35%,
    rgba(0,0,0,.84) 40%,
    rgba(0,0,0,.95) 45%,
    black 50%,
    black 100%
  );
  mask-image:linear-gradient(
    to right,
    transparent 0%,
    transparent 5%,
    rgba(0,0,0,.02) 10%,
    rgba(0,0,0,.07) 15%,
    rgba(0,0,0,.16) 20%,
    rgba(0,0,0,.30) 25%,
    rgba(0,0,0,.48) 30%,
    rgba(0,0,0,.68) 35%,
    rgba(0,0,0,.84) 40%,
    rgba(0,0,0,.95) 45%,
    black 50%,
    black 100%
  );
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
}
.content{
  position:relative;
  z-index:5;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:clamp(28px,6vw,90px);
}
.card{
  width:min(560px,78vw);
  text-align:left;
}
.brand{
  margin:0 0 .45em;
  font-size:clamp(34px,5vw,72px);
  font-weight:400;
  letter-spacing:.04em;
}
.person{
  margin:0 0 1.25em;
  font-size:clamp(20px,2.2vw,32px);
  opacity:.76;
}
.official{
  margin:0 0 1.5em;
  font-size:clamp(15px,1.3vw,19px);
  line-height:1.55;
  font-style:italic;
  color:var(--warm);
  opacity:.9;
}
.mail{
  display:inline-block;
  margin:0 0 2.4em;
  color:var(--text);
  text-decoration:none;
  font-size:clamp(16px,1.5vw,21px);
  opacity:.84;
  border-bottom:1px solid rgba(241,238,233,.28);
  padding-bottom:.15em;
}
.home-link{
  display:inline-block;
  color:var(--warm);
  text-decoration:none;
  font-size:clamp(14px,1.15vw,18px);
  letter-spacing:.08em;
  border:1px solid rgba(184,137,98,.35);
  padding:.7em 1.15em;
  opacity:.78;
}
@media(max-aspect-ratio:9/16){
  .artboard{
    width:100vw;
    height:auto;
    aspect-ratio:9/16;
    right:0;
    top:50%;
    transform:translateY(-50%);
  }
}
@media(max-width:700px){
  .content{
    align-items:flex-end;
    padding:24px 20px 34px;
  }
  .card{
    width:min(92vw,520px);
  }
  .brand{
    font-size:clamp(30px,9vw,48px);
  }
  .person{
    font-size:clamp(18px,5vw,24px);
  }
  .official{
    font-size:clamp(14px,4vw,17px);
  }
  .mail{
    font-size:clamp(15px,4vw,18px);
    margin-bottom:1.7em;
  }
}
</style>
</head>
<body>
<main class="page">
  <div class="artboard" aria-hidden="true">
    <img class="artwork" src="main-bg.png" alt="">
  </div>

  <section class="content">
    <div class="card">
      <h1 class="brand">Meand</h1>
      <p class="person">Andrey Panov</p>
      <p class="official">Official website of Meand / Andrey Panov</p>
      <a class="mail" href="mailto:andrey-a-ka@yandex.com">andrey-a-ka@yandex.com</a><br>
      <a class="home-link" href="index.html">На главную</a>
    </div>
  </section>
</main>
</body>
</html>
