<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тексты — MeAND</title>
<link rel="icon" type="image/png" href="/Favicon.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --bg:#292929;
  --fg:#eee9e3;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--fg);
}
body{
  font-family:Georgia,"Times New Roman",serif;
}
.page{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:var(--bg);
}
.artboard{
  position:absolute;
  z-index:0;
  right:0;
  top:50%;
  height:100vh;
  height:100dvh;
  aspect-ratio:9/16;
  transform:translateY(-50%);
  overflow:visible;
  pointer-events:none;
}
.artwork{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  pointer-events:none;
  user-select:none;
  opacity:.095;
  filter:brightness(.72) saturate(.22) contrast(.92);
  -webkit-mask-image:linear-gradient(to right,transparent 0%,transparent 5%,rgba(0,0,0,.02) 10%,rgba(0,0,0,.07) 15%,rgba(0,0,0,.16) 20%,rgba(0,0,0,.30) 25%,rgba(0,0,0,.48) 30%,rgba(0,0,0,.68) 35%,rgba(0,0,0,.84) 40%,rgba(0,0,0,.95) 45%,black 50%,black 100%);
  mask-image:linear-gradient(to right,transparent 0%,transparent 5%,rgba(0,0,0,.02) 10%,rgba(0,0,0,.07) 15%,rgba(0,0,0,.16) 20%,rgba(0,0,0,.30) 25%,rgba(0,0,0,.48) 30%,rgba(0,0,0,.68) 35%,rgba(0,0,0,.84) 40%,rgba(0,0,0,.95) 45%,black 50%,black 100%);
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
}
.content{
  position:relative;
  z-index:2;
  min-height:100vh;
  min-height:100dvh;
  padding:clamp(28px,5vw,72px);
}
.title{
  margin:0;
  font-size:clamp(30px,4.2vw,64px);
  font-weight:400;
  letter-spacing:.04em;
  opacity:.78;
}
.home{
  position:fixed;
  z-index:3;
  left:clamp(18px,3vw,42px);
  bottom:clamp(16px,2.6vw,34px);
  color:var(--fg);
  text-decoration:none;
  font-size:clamp(13px,1.1vw,17px);
  letter-spacing:.08em;
  opacity:.28;
  transition:opacity .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.home:hover,.home:focus-visible{
  opacity:.78;
  outline:none;
}
@media(max-aspect-ratio:9/16){
  .artboard{
    width:100vw;
    height:auto;
    aspect-ratio:9/16;
    right:0;
    top:50%;
    transform:translateY(-50%);
  }
}
@media(max-width:700px){
  .content{padding:24px 20px}
  .title{font-size:clamp(28px,10vw,44px)}
  .artwork{opacity:.075}
  .home{left:18px;bottom:18px}
}
</style>
</head>
<body>
<main class="page">
  <div class="artboard" aria-hidden="true">
    <img
      class="artwork"
      src="main-bg.png"
      alt=""
      loading="lazy"
      decoding="async"
      fetchpriority="low"
      draggable="false">
  </div>

  <section class="content">
    <h1 class="title">Тексты</h1>
  </section>

  <a class="home" href="index.html">на главную</a>
</main>
</body>
</html>
