<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тексты — MeAND</title>
<link rel="icon" type="image/png" href="/Favicon.png">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
:root{
  --bg:#292929;
  --fg:#eee9e3;
  --ghost:#d8d0c4;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--fg);
}
body{
  font-family:Georgia,"Times New Roman",serif;
}
.page{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background:var(--bg);
}
.guitar{
  position:absolute;
  z-index:0;
  right:-2vw;
  top:50%;
  width:min(58vw,760px);
  height:auto;
  transform:translateY(-50%);
  color:var(--ghost);
  opacity:.055;
  pointer-events:none;
  user-select:none;
}
.guitar *{
  vector-effect:non-scaling-stroke;
}
.content{
  position:relative;
  z-index:2;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  padding:clamp(28px,5vw,72px);
}
.title{
  margin:0;
  font-size:clamp(30px,4.2vw,64px);
  font-weight:400;
  letter-spacing:.04em;
  opacity:.78;
}
.home{
  position:fixed;
  z-index:3;
  left:clamp(18px,3vw,42px);
  bottom:clamp(16px,2.6vw,34px);
  color:var(--fg);
  text-decoration:none;
  font-size:clamp(13px,1.1vw,17px);
  letter-spacing:.08em;
  opacity:.28;
  transition:opacity .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.home:hover,.home:focus-visible{
  opacity:.78;
  outline:none;
}
@media(max-width:700px){
  .content{
    padding:24px 20px;
  }
  .title{
    font-size:clamp(28px,10vw,44px);
  }
  .guitar{
    width:118vw;
    right:-34vw;
    top:53%;
    opacity:.045;
  }
  .home{
    left:18px;
    bottom:18px;
  }
}
</style>
</head>
<body>
<main class="page">
  <svg class="guitar" viewBox="0 0 420 920" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">

               C191 32 179 46 181 67
               L184 188

               C226 233 215 213 216 188
               L219 67

      <path d="M185 190 L235 190"/>

      <path d="M199 62 L221 62"/>
      <ellipse cx="210" cy="385" rx="31" ry="31"/>
      <path d="M177 518 Q210 532 243 518"/>
      <path d="M174 527 Q210 542 246 527"/>
      <path d="M180 493 L240 493"/>

  <section class="content">
    <h1 class="title">Тексты</h1>

  <a class="home" href="index.html">на главную</a>

</html>
