<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>me/and.ru</title>

<style>

    /* =========================================================
       БАЗОВЫЕ ПАРАМЕТРЫ
       ========================================================= */

    :root {

        --brown: #1b0903;

        --breath-time: 5.5s;

        --page-transition-time: 2s;

    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;

        overflow: hidden;

        background: var(--brown);

    }


    body {

        font-family:
            Georgia,
            "Times New Roman",
            serif;

    }


    /* =========================================================
       СЦЕНА
       ========================================================= */

    .home {

        position: fixed;

        inset: 0;

        overflow: hidden;

        background:
            var(--brown);

        opacity: 1;

        transition:
            opacity var(--page-transition-time) ease,
            filter var(--page-transition-time) ease;

    }


    /* =========================================================
       БАРХАТНЫЙ ФОН

       Он заполняет всё свободное пространство,
       которое появляется на широких мониторах.

       Поэтому вертикальный эталон НЕ растягивается
       на весь монитор.
       ========================================================= */

    .velvet-background {

        position: absolute;

        inset: -5%;

        z-index: 0;

        background:

            radial-gradient(
                ellipse at 78% 15%,
                rgba(116, 48, 10, .55) 0%,
                rgba(65, 22, 5, .48) 30%,
                rgba(28, 8, 2, .92) 72%,
                #130501 100%
            ),

            linear-gradient(
                90deg,
                #120401 0%,
                #1b0702 45%,
                #321006 100%
            );

    }


    /*
       Очень мягкое свечение справа.

       Это продолжает атмосферу исходника,
       но не пытается повторить струны
       или отверстие.
    */

    .velvet-background::after {

        content: "";

        position: absolute;

        inset: 0;

        background:

            radial-gradient(
                ellipse at 91% 7%,
                rgba(208, 103, 35, .13),
                transparent 34%
            );

        pointer-events: none;

    }


    /* =========================================================
       КОМПОЗИЦИОННАЯ ПЛОСКОСТЬ

       ЭТО ГЛАВНОЕ ИЗМЕНЕНИЕ.

       Внутри неё находятся одновременно:

       main-bg.png
       +
       надписи

       Поэтому они масштабируются ВМЕСТЕ.

       Соотношение сторон равно исходному
       вертикальному изображению 9:16.
       ========================================================= */

    .artboard {

        position: absolute;

        z-index: 5;


        /*
           На вертикальном экране
           эталон занимает весь экран.
        */

        height: 100vh;

        height: 100dvh;


        /*
           Ширина вычисляется из высоты.

           Никакого cover.
           Никакого растягивания.
        */

        aspect-ratio: 9 / 16;


        /*
           Композиция привязана к правому краю.
        */

        right: 0;

        top: 50%;

        transform:
            translateY(-50%);


        overflow: visible;

    }


    /* =========================================================
       ЭТАЛОННОЕ ИЗОБРАЖЕНИЕ
       ========================================================= */

    .artwork {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;

        user-select: none;

    }


    /* =========================================================
       НАВИГАЦИЯ

       ВАЖНО:

       Координаты находятся внутри ARTBOARD,
       а НЕ внутри окна браузера.

       Поэтому при изменении экрана надписи
       остаются привязанными к струнам.
       ========================================================= */

    .string-menu {

        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

    }


    .menu-item {

        position: absolute;

        writing-mode: vertical-rl;

        transform:
            translateX(50%)
            rotate(180deg);

        transform-origin:
            center center;

        color: #fff;

        font-family:
            Georgia,
            "Times New Roman",
            serif;

        /*
           Размер зависит от размера artboard,
           а не от ширины огромного монитора.
        */

        font-size:
            clamp(15px, 2.0vh, 30px);

        font-weight: 400;

        line-height: 1;

        letter-spacing: .10em;

        white-space: nowrap;

        text-decoration: none;

        opacity: .08;

        pointer-events: auto;

        cursor: pointer;

        user-select: none;

        text-shadow:

            0 0 3px
            rgba(255,255,255,.05);

        animation:

            textBreath
            var(--breath-time)
            ease-in-out
            infinite;

        transition:

            opacity .35s ease,
            text-shadow .35s ease;

    }


    /* =========================================================
       ПОЛОЖЕНИЕ НАДПИСЕЙ

       Все координаты теперь относятся
       к самой вертикальной композиции.

       Они не зависят от разрешения монитора.
       ========================================================= */


    /* МЕБЕЛЬ */

    .menu-furniture {

        left: 65.0%;

        top: 16%;

    }


    /* СКРИПТЫ */

    .menu-scripts {

        left: 72.3%;

        top: 20%;

    }


    /* РАЗНОЕ */

    .menu-other {

        left: 79.0%;

        top: 24%;

    }


    /* ПРОЗА */

    .menu-prose {

        left: 85.3%;

        top: 28%;

    }


    /* ТЕКСТЫ */

    .menu-texts {

        left: 91.5%;

        top: 32%;

    }


    /* =========================================================
       НАВЕДЕНИЕ
       ========================================================= */

    .menu-item:hover,
    .menu-item:focus-visible {

        opacity: 1 !important;

        outline: none;

        text-shadow:

            0 0 7px
            rgba(255,255,255,.75),

            0 0 20px
            rgba(255,245,230,.30);

    }


    /* =========================================================
       ДЫХАНИЕ ТЕКСТА
       ========================================================= */

    @keyframes textBreath {

        0%,
        100% {

            opacity: .07;

            text-shadow:

                0 0 2px
                rgba(255,255,255,.03);

        }


        50% {

            opacity: 1;

            text-shadow:

                0 0 7px
                rgba(255,255,255,.58),

                0 0 20px
                rgba(255,240,220,.25);

        }

    }


    /* =========================================================
       ЛОГОТИП

       Логотип НЕ входит в картинку.
       Это независимый слой страницы.
       ========================================================= */

    .logo {

        position: fixed;

        z-index: 30;

        left:
            clamp(24px, 4vw, 80px);

        top:
            clamp(24px, 5vh, 75px);

        width:
            clamp(75px, 9vw, 155px);

        opacity: .04;

        pointer-events: none;

        user-select: none;

        animation:

            logoBreath
            var(--breath-time)
            ease-in-out
            infinite;

    }


    .logo img {

        display: block;

        width: 100%;
        height: auto;

    }


    @keyframes logoBreath {

        0%,
        100% {

            opacity: .035;

        }


        50% {

            opacity: .27;

        }

    }


    /* =========================================================
       ПЕРЕХОД МЕЖДУ СТРАНИЦАМИ
       ========================================================= */

    .transition-layer {

        position: fixed;

        inset: 0;

        z-index: 100;

        opacity: 0;

        pointer-events: none;

        background: #fff;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }


    body.leaving
    .transition-layer {

        opacity: 1;

    }


    body.leaving
    .home {

        opacity: 0;

        filter:
            blur(2px)
            brightness(1.08);

    }


    body.leaving
    .logo {

        opacity: 0;

    }


    /* =========================================================
       ВЕРТИКАЛЬНЫЕ ЭКРАНЫ

       Если экран уже самого изображения,
       artboard начинает определяться шириной,
       чтобы ничего важного не обрезалось.
       ========================================================= */

    @media
    (max-aspect-ratio: 9/16) {

        .artboard {

            width: 100vw;

            height: auto;

            aspect-ratio: 9 / 16;

            right: 0;

            top: 50%;

            transform:
                translateY(-50%);

        }

    }


    /* =========================================================
       ПЛАНШЕТ / МОБИЛЬНЫЙ
       ========================================================= */

    @media
    (max-width: 700px) {

        .logo {

            left: 5vw;

            top: 4vh;

            width:
                clamp(
                    68px,
                    19vw,
                    105px
                );

        }


        .menu-item {

            font-size:
                clamp(
                    14px,
                    3.7vw,
                    20px
                );

        }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

        .menu-item,
        .logo {

            animation: none;

        }


        .menu-item {

            opacity: .8;

        }


        .logo {

            opacity: .16;

        }


        .home,
        .transition-layer {

            transition-duration: .25s;

        }

    }

</style>
</head>


<body>


<!-- =========================================================
     ГЛАВНАЯ СТРАНИЦА
     ========================================================= -->

<main
    class="home"
    id="home"
>


    <!--
        Бархатное продолжение среды.

        На широком экране оно занимает пространство
        слева от вертикального эталона.
    -->

    <div
        class="velvet-background"
        aria-hidden="true"
    ></div>



    <!-- =====================================================
         ARTBOARD

         Внутри одной координатной системы находятся
         и рисунок, и надписи.

         Это гарантирует их совместное масштабирование.
         ===================================================== -->

    <div
        class="artboard"
    >


        <!-- ФОНОВЫЙ ЭТАЛОН -->

        <img
            class="artwork"
            src="main-bg.png"
            alt=""
            draggable="false"
        >



        <!-- НАВИГАЦИЯ -->

        <nav
            class="string-menu"
            aria-label="Основные разделы"
        >


            <a
                class="menu-item menu-furniture"

                href="furniture.html"

                data-color="#ffffff"
            >
                Мебель
            </a>


            <a
                class="menu-item menu-scripts"

                href="scripts.html"

                data-color="#18382b"
            >
                Скрипты
            </a>


            <a
                class="menu-item menu-other"

                href="other.html"

                data-color="#d8d0c4"
            >
                Разное
            </a>


            <a
                class="menu-item menu-prose"

                href="prose.html"

                data-color="#332d2a"
            >
                Проза
            </a>


            <a
                class="menu-item menu-texts"

                href="texts.html"

                data-color="#292929"
            >
                Тексты
            </a>


        </nav>

    </div>



    <!-- =====================================================
         ЛОГОТИП
         ===================================================== -->

    <div
        class="logo"
    >

        <img
            src="logo.png"
            alt=""
            draggable="false"
        >

    </div>


</main>



<!-- =========================================================
     ПЕРЕХОДНЫЙ СЛОЙ
     ========================================================= -->

<div
    class="transition-layer"
    id="transitionLayer"
    aria-hidden="true"
></div>



<script>

(() => {


    const links =
        document.querySelectorAll(
            ".menu-item"
        );


    const transitionLayer =
        document.getElementById(
            "transitionLayer"
        );


    let transitionStarted =
        false;



    /* =====================================================
       ПЕРЕХОД ПО РАЗДЕЛАМ
       ===================================================== */

    links.forEach(link => {


        link.addEventListener(
            "click",
            event => {


                /*
                   Стандартные браузерные комбинации
                   не перехватываем.
                */

                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.altKey
                ) {

                    return;

                }


                event.preventDefault();


                if (
                    transitionStarted
                ) {

                    return;

                }


                transitionStarted =
                    true;



                const destination =
                    link.href;


                const targetColor =
                    link.dataset.color
                    ||
                    "#ffffff";



                /*
                   Устанавливаем цвет среды
                   следующего раздела.
                */

                transitionLayer.style.backgroundColor =
                    targetColor;



                /*
                   Запускаем растворение.
                */

                requestAnimationFrame(
                    () => {

                        document.body
                            .classList
                            .add(
                                "leaving"
                            );

                    }
                );



                /*
                   После двух секунд
                   открываем страницу.
                */

                window.setTimeout(
                    () => {

                        window.location.href =
                            destination;

                    },

                    2000
                );


            }
        );


    });



    /* =====================================================
       ВОЗВРАТ КНОПКОЙ BACK
       ===================================================== */

    window.addEventListener(
        "pageshow",
        () => {


            transitionStarted =
                false;


            document.body
                .classList
                .remove(
                    "leaving"
                );


            transitionLayer
                .style
                .backgroundColor =
                "";


        }
    );


})();

</script>


</body>
</html>
