<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>me/and.ru</title>

<style>

    /* =========================================================
       ОСНОВНЫЕ ПАРАМЕТРЫ
       ========================================================= */

    :root {

        /*
           Основной цвет взят максимально близко
           к тёмной коричневой среде изображения.
        */

        --brown-dark: #170703;
        --brown-main: #260c04;
        --brown-warm: #351207;

        --breath-time: 5.5s;
        --page-transition-time: 2s;

    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;

        overflow: hidden;

        background:
            var(--brown-main);

    }


    body {

        font-family:
            Georgia,
            "Times New Roman",
            serif;

    }


    /* =========================================================
       ГЛАВНАЯ СТРАНИЦА
       ========================================================= */

    .home {

        position: fixed;

        inset: 0;

        overflow: hidden;

        background:
            var(--brown-main);

        opacity: 1;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1),

            filter
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }


    /* =========================================================
       ОБЩИЙ БАРХАТНЫЙ ФОН

       Теперь это не просто коричневая заливка.

       Градиенты продолжают световую среду изображения
       в левую часть большого монитора.
       ========================================================= */

    .velvet-background {

        position: absolute;

        inset: 0;

        z-index: 0;

        background:

            radial-gradient(
                ellipse 95% 130%
                at 84% 18%,

                rgba(92, 31, 7, .52) 0%,

                rgba(62, 19, 5, .45) 27%,

                rgba(40, 11, 3, .35) 52%,

                transparent 76%
            ),

            radial-gradient(
                ellipse 75% 100%
                at 58% 62%,

                rgba(72, 21, 5, .22) 0%,

                transparent 72%
            ),

            linear-gradient(
                90deg,

                #180602 0%,

                #1d0702 25%,

                #230902 48%,

                #2b0d04 70%,

                #311006 100%
            );

    }


    /*
       Очень мягкая тень сверху и снизу.

       Она делает фон менее похожим
       на компьютерный градиент.
    */

    .velvet-background::before {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            linear-gradient(
                180deg,

                rgba(0,0,0,.15) 0%,

                transparent 25%,

                transparent 72%,

                rgba(0,0,0,.16) 100%
            );

    }


    /*
       Контровое тепло справа.
    */

    .velvet-background::after {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            radial-gradient(
                ellipse 42% 80%
                at 100% 5%,

                rgba(180, 78, 21, .10),

                transparent 72%
            );

    }


    /* =========================================================
       КОМПОЗИЦИОННАЯ ПЛОСКОСТЬ

       Соотношение сторон исходника сохраняется.
       ========================================================= */

    .artboard {

        position: absolute;

        z-index: 5;

        right: 0;

        top: 50%;

        height: 100vh;
        height: 100dvh;

        aspect-ratio: 9 / 16;

        transform:
            translateY(-50%);

        overflow: visible;

    }


    /* =========================================================
       MAIN-BG.PNG

       Изображение не является обычным background.

       Благодаря этому мы можем независимо
       управлять его прозрачностью и растворением.
       ========================================================= */

    .artwork {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;

        user-select: none;


        /*
           Немного приглушаем весь рисунок.

           НЕ делаем его сильно прозрачным,
           иначе пропадут струны.
        */

        opacity: .82;


        /*
           Чуть убираем агрессивную яркость
           и насыщенность янтарного света.
        */

        filter:

            brightness(.84)
            saturate(.82)
            contrast(.94);


        /*
           КЛЮЧЕВОЙ МОМЕНТ.

           Левая часть изображения постепенно
           становится прозрачной.

           Поэтому вертикальная граница artboard
           больше не должна читаться.
        */

        -webkit-mask-image:

            linear-gradient(
                to right,

                transparent 0%,

                rgba(0,0,0,.08) 5%,

                rgba(0,0,0,.28) 13%,

                rgba(0,0,0,.60) 24%,

                rgba(0,0,0,.86) 36%,

                #000 49%,

                #000 100%
            );


        mask-image:

            linear-gradient(
                to right,

                transparent 0%,

                rgba(0,0,0,.08) 5%,

                rgba(0,0,0,.28) 13%,

                rgba(0,0,0,.60) 24%,

                rgba(0,0,0,.86) 36%,

                #000 49%,

                #000 100%
            );

    }


    /* =========================================================
       ДОПОЛНИТЕЛЬНОЕ РАСТВОРЕНИЕ

       Поверх левой части изображения лежит
       прозрачная коричневая вуаль.

       Она дополнительно убирает ощущение
       "вставленной фотографии".
       ========================================================= */

    .artboard::after {

        content: "";

        position: absolute;

        inset: 0;

        z-index: 10;

        pointer-events: none;

        background:

            linear-gradient(
                90deg,

                rgba(35, 9, 2, .72) 0%,

                rgba(35, 9, 2, .45) 15%,

                rgba(35, 9, 2, .20) 29%,

                rgba(35, 9, 2, .05) 42%,

                transparent 55%
            );

    }


    /* =========================================================
       НАВИГАЦИЯ
       ========================================================= */

    .string-menu {

        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

    }


    .menu-item {

        position: absolute;

        writing-mode:
            vertical-rl;

        /*
           Читается СНИЗУ ВВЕРХ.
        */

        transform:

            translateX(50%)
            rotate(180deg);

        transform-origin:
            center center;


        color:
            #ffffff;


        font-family:

            Georgia,
            "Times New Roman",
            serif;


        font-size:

            clamp(
                15px,
                2vh,
                30px
            );


        font-weight:
            400;


        line-height:
            1;


        letter-spacing:
            .10em;


        white-space:
            nowrap;


        text-decoration:
            none;


        opacity:
            .08;


        pointer-events:
            auto;


        cursor:
            pointer;


        user-select:
            none;


        text-shadow:

            0 0 3px
            rgba(255,255,255,.04);


        animation:

            textBreath
            var(--breath-time)
            ease-in-out
            infinite;


        transition:

            opacity .35s ease,

            text-shadow .35s ease;

    }


    /* =========================================================
       ПОЛОЖЕНИЕ НАДПИСЕЙ

       Координаты относятся К ARTBOARD,
       а не к экрану.
       ========================================================= */


    .menu-furniture {

        left: 65.0%;
        top: 16%;

    }


    .menu-scripts {

        left: 72.3%;
        top: 20%;

    }


    .menu-other {

        left: 79.0%;
        top: 24%;

    }


    .menu-prose {

        left: 85.3%;
        top: 28%;

    }


    .menu-texts {

        left: 91.5%;
        top: 32%;

    }


    /* =========================================================
       НАВЕДЕНИЕ
       ========================================================= */

    .menu-item:hover,
    .menu-item:focus-visible {

        opacity:
            1 !important;

        outline:
            none;

        text-shadow:

            0 0 7px
            rgba(255,255,255,.75),

            0 0 20px
            rgba(255,240,220,.28);

    }


    /* =========================================================
       ДЫХАНИЕ НАДПИСЕЙ
       ========================================================= */

    @keyframes textBreath {

        0%,
        100% {

            opacity:
                .06;

            text-shadow:

                0 0 2px
                rgba(255,255,255,.025);

        }


        50% {

            opacity:
                1;

            text-shadow:

                0 0 7px
                rgba(255,255,255,.58),

                0 0 20px
                rgba(255,240,220,.24);

        }

    }


    /* =========================================================
       ЛОГОТИП
       ========================================================= */

    .logo {

        position:
            fixed;

        z-index:
            30;


        left:

            clamp(
                24px,
                4vw,
                80px
            );


        top:

            clamp(
                24px,
                5vh,
                75px
            );


        width:

            clamp(
                75px,
                9vw,
                155px
            );


        opacity:
            .04;


        pointer-events:
            none;


        user-select:
            none;


        animation:

            logoBreath
            var(--breath-time)
            ease-in-out
            infinite;

    }


    .logo img {

        display:
            block;

        width:
            100%;

        height:
            auto;

    }


    @keyframes logoBreath {

        0%,
        100% {

            opacity:
                .035;

        }


        50% {

            opacity:
                .27;

        }

    }


    /* =========================================================
       ПЕРЕХОД В ДРУГОЙ РАЗДЕЛ
       ========================================================= */

    .transition-layer {

        position:
            fixed;

        inset:
            0;

        z-index:
            100;

        opacity:
            0;

        pointer-events:
            none;

        background:
            #ffffff;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }


    body.leaving
    .transition-layer {

        opacity:
            1;

    }


    body.leaving
    .home {

        opacity:
            0;

        filter:

            blur(2px)
            brightness(1.05);

    }


    body.leaving
    .logo {

        opacity:
            0;

    }


    /* =========================================================
       ОЧЕНЬ УЗКИЙ ВЕРТИКАЛЬНЫЙ ЭКРАН
       ========================================================= */

    @media
    (max-aspect-ratio: 9/16) {

        .artboard {

            width:
                100vw;

            height:
                auto;

            aspect-ratio:
                9 / 16;

            right:
                0;

            top:
                50%;

            transform:
                translateY(-50%);

        }

    }


    /* =========================================================
       СМАРТФОН
       ========================================================= */

    @media
    (max-width: 700px) {

        .logo {

            left:
                5vw;

            top:
                4vh;

            width:

                clamp(
                    68px,
                    19vw,
                    105px
                );

        }


        .menu-item {

            font-size:

                clamp(
                    14px,
                    3.7vw,
                    20px
                );

        }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

        .menu-item,
        .logo {

            animation:
                none;

        }


        .menu-item {

            opacity:
                .80;

        }


        .logo {

            opacity:
                .16;

        }


        .home,
        .transition-layer {

            transition-duration:
                .25s;

        }

    }

</style>
</head>


<body>


<!-- =========================================================
     ГЛАВНАЯ
     ========================================================= -->

<main
    class="home"
    id="home"
>


    <!-- ОБЩИЙ БАРХАТНЫЙ ФОН -->

    <div
        class="velvet-background"
        aria-hidden="true"
    ></div>



    <!-- =====================================================
         ЕДИНАЯ КОМПОЗИЦИОННАЯ ПЛОСКОСТЬ
         ===================================================== -->

    <div
        class="artboard"
    >


        <!-- ЭТАЛОН -->

        <img
            class="artwork"
            src="main-bg.png"
            alt=""
            draggable="false"
        >



        <!-- НАВИГАЦИЯ -->

        <nav
            class="string-menu"
            aria-label="Основные разделы"
        >


            <a
                class="
                    menu-item
                    menu-furniture
                "

                href="furniture.html"

                data-color="#ffffff"
            >
                Мебель
            </a>



            <a
                class="
                    menu-item
                    menu-scripts
                "

                href="scripts.html"

                data-color="#18382b"
            >
                Скрипты
            </a>



            <a
                class="
                    menu-item
                    menu-other
                "

                href="other.html"

                data-color="#d8d0c4"
            >
                Разное
            </a>



            <a
                class="
                    menu-item
                    menu-prose
                "

                href="prose.html"

                data-color="#332d2a"
            >
                Проза
            </a>



            <a
                class="
                    menu-item
                    menu-texts
                "

                href="texts.html"

                data-color="#292929"
            >
                Тексты
            </a>


        </nav>


    </div>



    <!-- =====================================================
         ЛОГОТИП
         ===================================================== -->

    <div
        class="logo"
    >

        <img
            src="logo.png"
            alt=""
            draggable="false"
        >

    </div>


</main>



<!-- =========================================================
     ПЕРЕХОДНЫЙ СЛОЙ
     ========================================================= -->

<div
    class="transition-layer"
    id="transitionLayer"
    aria-hidden="true"
></div>



<script>

(() => {


    const links =
        document.querySelectorAll(
            ".menu-item"
        );


    const transitionLayer =
        document.getElementById(
            "transitionLayer"
        );


    let transitionStarted =
        false;



    /* =====================================================
       ПЕРЕХОДЫ
       ===================================================== */

    links.forEach(link => {


        link.addEventListener(
            "click",
            event => {


                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.altKey
                ) {

                    return;

                }


                event.preventDefault();


                if (
                    transitionStarted
                ) {

                    return;

                }


                transitionStarted =
                    true;



                const destination =
                    link.href;


                const targetColor =
                    link.dataset.color
                    ||
                    "#ffffff";



                transitionLayer
                    .style
                    .backgroundColor =
                    targetColor;



                requestAnimationFrame(
                    () => {

                        document
                            .body
                            .classList
                            .add(
                                "leaving"
                            );

                    }
                );



                window.setTimeout(
                    () => {

                        window.location.href =
                            destination;

                    },

                    2000
                );


            }
        );


    });



    /* =====================================================
       ВОЗВРАТ КНОПКОЙ НАЗАД
       ===================================================== */

    window.addEventListener(
        "pageshow",
        () => {


            transitionStarted =
                false;


            document
                .body
                .classList
                .remove(
                    "leaving"
                );


            transitionLayer
                .style
                .backgroundColor =
                "";

        }
    );


})();

</script>


</body>
</html>
