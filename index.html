<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>me/and.ru</title>


<style>

    /* =========================================================
       ОСНОВНЫЕ ПАРАМЕТРЫ
       ========================================================= */

    :root {

        --main-dark: #080503;

        --breath-time: 5.5s;
        --page-transition-time: 2s;

    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;

        overflow: hidden;

        background:
            var(--main-dark);

    }


    body {

        font-family:
            Georgia,
            "Times New Roman",
            serif;

    }



    /* =========================================================
       ГЛАВНАЯ СЦЕНА
       ========================================================= */

    .home {

        position: fixed;

        inset: 0;

        overflow: hidden;

        background:
            var(--main-dark);

        opacity: 1;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1),

            filter
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }



    /* =========================================================
       ОСНОВНАЯ ТЁМНАЯ СРЕДА
       ========================================================= */

    .velvet-background {

        position: absolute;

        inset: 0;

        z-index: 0;

        background:

            radial-gradient(
                ellipse 65% 105%
                at 88% 48%,

                rgba(27,16,10,.10) 0%,

                rgba(15,9,6,.045) 43%,

                transparent 74%
            ),

            linear-gradient(
                90deg,

                #080503 0%,

                #080503 55%,

                #090604 75%,

                #0b0705 100%
            );

    }



    /* =========================================================
       МЯГКАЯ ВИНЬЕТКА
       ========================================================= */

    .velvet-background::before {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            radial-gradient(
                ellipse at center,

                transparent 55%,

                rgba(0,0,0,.09) 100%
            );

    }



    /* =========================================================
       ОЧЕНЬ ЛЁГКОЕ ТЕПЛО СПРАВА
       ========================================================= */

    .velvet-background::after {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            radial-gradient(
                ellipse 25% 62%
                at 100% 15%,

                rgba(70,38,22,.025),

                transparent 80%
            );

    }



    /* =========================================================
       ARTBOARD

       Вся правая композиция существует
       в единой системе координат.
       ========================================================= */

    .artboard {

        position: absolute;

        z-index: 5;

        right: 0;

        top: 50%;

        height: 100vh;
        height: 100dvh;

        aspect-ratio: 9 / 16;

        transform:
            translateY(-50%);

        overflow: visible;

    }



    /* =========================================================
       ИЗОБРАЖЕНИЕ
       ========================================================= */

    .artwork {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;

        user-select: none;


        /*
           Общая прозрачность изображения.

           Пока оставляем 0.70:
           справа результат уже очень близок.
        */

        opacity: .70;


        filter:

            brightness(.82)
            saturate(.78)
            contrast(.92);



        /* =====================================================
           ПЛАВНОЕ РАСТВОРЕНИЕ

           Теперь НЕТ набора ступеней.

           Только:
             прозрачное изображение
                     ↓
             непрерывный градиент
                     ↓
             полноценное изображение

           0–8%:
           практически полностью растворено.

           8–38%:
           один непрерывный мягкий переход.

           После 38%:
           изображение полностью проявлено.
           ===================================================== */

        -webkit-mask-image:

            linear-gradient(
                90deg,

                transparent 0%,

                transparent 7%,

                #000 39%,

                #000 100%
            );


        mask-image:

            linear-gradient(
                90deg,

                transparent 0%,

                transparent 7%,

                #000 39%,

                #000 100%
            );


        -webkit-mask-repeat:
            no-repeat;

        mask-repeat:
            no-repeat;


        -webkit-mask-size:
            100% 100%;

        mask-size:
            100% 100%;

    }



    /*
       Раньше здесь была дополнительная
       коричневая градиентная вуаль.

       ЕЁ УБРАЛИ.

       Теперь ничего не накладывается поверх
       изображения и не создаёт дополнительных
       полос или границ.
    */

    .artboard::after {

        display: none;

    }



    /* =========================================================
       НАВИГАЦИЯ
       ========================================================= */

    .string-menu {

        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

    }



    .menu-item {

        position: absolute;

        writing-mode:
            vertical-rl;


        /*
           Текст читается снизу вверх.

           left = центральная ось надписи.
        */

        transform:

            translateX(-50%)
            rotate(180deg);


        transform-origin:
            center center;


        color:
            #ffffff;


        font-family:

            Georgia,
            "Times New Roman",
            serif;


        font-size:

            clamp(
                15px,
                2vh,
                30px
            );


        font-weight:
            400;


        line-height:
            1;


        letter-spacing:
            .10em;


        white-space:
            nowrap;


        text-decoration:
            none;


        opacity:
            .08;


        pointer-events:
            auto;


        cursor:
            pointer;


        user-select:
            none;


        text-shadow:

            0 0 3px
            rgba(255,255,255,.04);


        animation:

            textBreath
            var(--breath-time)
            ease-in-out
            infinite;


        transition:

            opacity .35s ease,

            text-shadow .35s ease;

    }



    /* =========================================================
       ПОЛОЖЕНИЕ НАДПИСЕЙ

       МЕБЕЛЬ и СКРИПТЫ немного возвращены вправо.

       РАЗНОЕ, ПРОЗА и ТЕКСТЫ оставлены
       по текущему удачному положению.
       ========================================================= */


    /* МЕБЕЛЬ */

    .menu-furniture {

        left: 66.3%;
        top: 16%;

    }



    /* СКРИПТЫ */

    .menu-scripts {

        left: 73.7%;
        top: 20%;

    }



    /* РАЗНОЕ */

    .menu-other {

        left: 80.4%;
        top: 24%;

    }



    /* ПРОЗА */

    .menu-prose {

        left: 87.5%;
        top: 28%;

    }



    /* ТЕКСТЫ */

    .menu-texts {

        left: 94.0%;
        top: 32%;

    }



    /* =========================================================
       НАВЕДЕНИЕ
       ========================================================= */

    .menu-item:hover,
    .menu-item:focus-visible {

        opacity:
            1 !important;

        outline:
            none;

        text-shadow:

            0 0 7px
            rgba(255,255,255,.75),

            0 0 20px
            rgba(255,240,220,.28);

    }



    /* =========================================================
       ДЫХАНИЕ ТЕКСТА
       ========================================================= */

    @keyframes textBreath {

        0%,
        100% {

            opacity:
                .06;

            text-shadow:

                0 0 2px
                rgba(255,255,255,.025);

        }


        50% {

            opacity:
                1;

            text-shadow:

                0 0 7px
                rgba(255,255,255,.58),

                0 0 20px
                rgba(255,240,220,.24);

        }

    }



    /* =========================================================
       ЛОГОТИП
       ========================================================= */

    .logo {

        position:
            fixed;

        z-index:
            30;


        left:

            clamp(
                24px,
                4vw,
                80px
            );


        top:

            clamp(
                24px,
                5vh,
                75px
            );


        width:

            clamp(
                75px,
                9vw,
                155px
            );


        opacity:
            .04;


        pointer-events:
            none;


        user-select:
            none;


        animation:

            logoBreath
            var(--breath-time)
            ease-in-out
            infinite;

    }



    .logo img {

        display: block;

        width: 100%;
        height: auto;

    }



    @keyframes logoBreath {

        0%,
        100% {

            opacity:
                .035;

        }


        50% {

            opacity:
                .27;

        }

    }



    /* =========================================================
       ПЕРЕХОД МЕЖДУ СТРАНИЦАМИ
       ========================================================= */

    .transition-layer {

        position: fixed;

        inset: 0;

        z-index: 100;

        opacity: 0;

        pointer-events: none;

        background:
            #ffffff;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }



    body.leaving
    .transition-layer {

        opacity: 1;

    }



    body.leaving
    .home {

        opacity: 0;

        filter:

            blur(2px)
            brightness(1.05);

    }



    body.leaving
    .logo {

        opacity: 0;

    }



    /* =========================================================
       ОЧЕНЬ УЗКИЙ ВЕРТИКАЛЬНЫЙ ЭКРАН
       ========================================================= */

    @media
    (max-aspect-ratio: 9/16) {

        .artboard {

            width: 100vw;

            height: auto;

            aspect-ratio: 9 / 16;

            right: 0;

            top: 50%;

            transform:
                translateY(-50%);

        }

    }



    /* =========================================================
       СМАРТФОН
       ========================================================= */

    @media
    (max-width: 700px) {

        .logo {

            left: 5vw;

            top: 4vh;

            width:

                clamp(
                    68px,
                    19vw,
                    105px
                );

        }


        .menu-item {

            font-size:

                clamp(
                    14px,
                    3.7vw,
                    20px
                );

        }

    }



    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

        .menu-item,
        .logo {

            animation: none;

        }


        .menu-item {

            opacity: .80;

        }


        .logo {

            opacity: .16;

        }


        .home,
        .transition-layer {

            transition-duration:
                .25s;

        }

    }

</style>

</head>


<body>


<main
    class="home"
    id="home"
>


    <!-- ОБЩИЙ ТЁМНЫЙ ФОН -->

    <div
        class="velvet-background"
        aria-hidden="true"
    ></div>



    <!-- =====================================================
         ЕДИНАЯ КОМПОЗИЦИЯ
         ===================================================== -->

    <div
        class="artboard"
    >


        <!-- СТРУНЫ + ОТВЕРСТИЕ -->

        <img
            class="artwork"
            src="main-bg.png"
            alt=""
            draggable="false"
        >



        <!-- НАВИГАЦИЯ -->

        <nav
            class="string-menu"
            aria-label="Основные разделы"
        >


            <a
                class="menu-item menu-furniture"
                href="furniture.html"
                data-color="#ffffff"
            >
                Мебель
            </a>


            <a
                class="menu-item menu-scripts"
                href="scripts.html"
                data-color="#18382b"
            >
                Скрипты
            </a>


            <a
                class="menu-item menu-other"
                href="other.html"
                data-color="#d8d0c4"
            >
                Разное
            </a>


            <a
                class="menu-item menu-prose"
                href="prose.html"
                data-color="#332d2a"
            >
                Проза
            </a>


            <a
                class="menu-item menu-texts"
                href="texts.html"
                data-color="#292929"
            >
                Тексты
            </a>


        </nav>


    </div>



    <!-- =====================================================
         ЛОГОТИП
         ===================================================== -->

    <div
        class="logo"
    >

        <img
            src="logo.png"
            alt=""
            draggable="false"
        >

    </div>


</main>



<!-- =========================================================
     ПЕРЕХОДНЫЙ СЛОЙ
     ========================================================= -->

<div
    class="transition-layer"
    id="transitionLayer"
    aria-hidden="true"
></div>



<script>

(() => {


    const links =
        document.querySelectorAll(
            ".menu-item"
        );


    const transitionLayer =
        document.getElementById(
            "transitionLayer"
        );


    let transitionStarted =
        false;



    /* =====================================================
       ПЕРЕХОДЫ
       ===================================================== */

    links.forEach(link => {


        link.addEventListener(
            "click",
            event => {


                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.altKey
                ) {

                    return;

                }


                event.preventDefault();


                if (transitionStarted) {

                    return;

                }


                transitionStarted = true;


                const destination =
                    link.href;


                const targetColor =
                    link.dataset.color ||
                    "#ffffff";


                transitionLayer
                    .style
                    .backgroundColor =
                    targetColor;


                requestAnimationFrame(
                    () => {

                        document
                            .body
                            .classList
                            .add("leaving");

                    }
                );


                window.setTimeout(
                    () => {

                        window.location.href =
                            destination;

                    },

                    2000
                );


            }
        );


    });



    /* =====================================================
       ВОЗВРАТ НАЗАД
       ===================================================== */

    window.addEventListener(
        "pageshow",
        () => {


            transitionStarted = false;


            document
                .body
                .classList
                .remove("leaving");


            transitionLayer
                .style
                .backgroundColor = "";

        }
    );


})();

</script>


</body>
</html>
