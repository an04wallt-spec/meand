<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>meand.ru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #20242a;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #20242a;
    }

    .logo {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(90vw, 1536px);
      height: auto;

      display: block;

      /* Проявляем очень тёмный рисунок */
      filter:
        brightness(2.4)
        contrast(1.15);

      opacity: 1;
    }

    .status {
      position: absolute;

      left: 50%;
      bottom: 7%;

      transform: translateX(-50%);

      margin: 0;

      font-size: clamp(13px, 1.1vw, 18px);
      font-weight: 300;

      letter-spacing: 0.32em;

      white-space: nowrap;

      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        color: #282d33;
        opacity: 0.15;
        text-shadow: none;
      }

      50% {
        color: #ffffff;
        opacity: 1;

        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.25),
          0 0 18px rgba(255, 255, 255, 0.10);
      }
    }

    @media (max-width: 600px) {
      .logo {
        width: 96vw;
      }

      .status {
        bottom: 6%;
        font-size: 11px;
        letter-spacing: 0.22em;
      }
    }
  </style>
</head>

<body>

  <main class="screen">

    <img
      class="logo"
      src="./logo.png"
      alt=""
    >

    <p class="status">
      САЙТ В РАЗРАБОТКЕ
    </p>

  </main>

</body>
</html>
