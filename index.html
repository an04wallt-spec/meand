<style>
:root{--main-dark:#080503;--breath-time:5.5s;--page-transition-time:2s;--poem-color:#b88962}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#080503}
body{font-family:Georgia,"Times New Roman",serif}
.home{position:fixed;inset:0;overflow:hidden;background:#080503;opacity:1;transition:opacity var(--page-transition-time) cubic-bezier(.45,0,.2,1),filter var(--page-transition-time) cubic-bezier(.45,0,.2,1)}
.velvet-background{position:absolute;inset:0;z-index:0;background:#080503}
.velvet-background::before,.velvet-background::after{content:none;display:none}
.artboard{position:absolute;z-index:5;right:0;top:50%;height:100vh;height:100dvh;aspect-ratio:9/16;transform:translateY(-50%);overflow:visible}
.artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;opacity:.70;filter:brightness(.82) saturate(.78) contrast(.92);-webkit-mask-image:linear-gradient(to right,transparent 0%,transparent 5%,rgba(0,0,0,.02) 10%,rgba(0,0,0,.07) 15%,rgba(0,0,0,.16) 20%,rgba(0,0,0,.30) 25%,rgba(0,0,0,.48) 30%,rgba(0,0,0,.68) 35%,rgba(0,0,0,.84) 40%,rgba(0,0,0,.95) 45%,black 50%,black 100%);mask-image:linear-gradient(to right,transparent 0%,transparent 5%,rgba(0,0,0,.02) 10%,rgba(0,0,0,.07) 15%,rgba(0,0,0,.16) 20%,rgba(0,0,0,.30) 25%,rgba(0,0,0,.48) 30%,rgba(0,0,0,.68) 35%,rgba(0,0,0,.84) 40%,rgba(0,0,0,.95) 45%,black 50%,black 100%);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.artboard::before,.artboard::after{content:none;display:none}
.string-menu{position:absolute;inset:0;z-index:20;pointer-events:none}
.blog-hotspot{display:none}
.menu-item{position:absolute;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);transform-origin:center center;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2vh,30px);font-weight:400;line-height:1;letter-spacing:.10em;white-space:nowrap;text-decoration:none;opacity:.08;pointer-events:auto;cursor:pointer;user-select:none;text-shadow:0 0 3px rgba(255,255,255,.04);animation:textBreath var(--breath-time) ease-in-out infinite;transition:opacity .35s ease,text-shadow .35s ease}
.menu-furniture{left:66.0%;top:16%}.menu-scripts{left:73.4%;top:20%}.menu-other{left:80.4%;top:24%}.menu-prose{left:87.5%;top:28%}.menu-texts{left:94.0%;top:32%}
.menu-item:hover,.menu-item:focus-visible{opacity:1!important;outline:none;text-shadow:0 0 7px rgba(255,255,255,.75),0 0 20px rgba(255,240,220,.28)}
@keyframes textBreath{0%,100%{opacity:.06;text-shadow:0 0 2px rgba(255,255,255,.025)}50%{opacity:1;text-shadow:0 0 7px rgba(255,255,255,.58),0 0 20px rgba(255,240,220,.24)}}
.poem{position:fixed;z-index:15;left:50%;bottom:clamp(12px,2vh,28px);transform:translateX(-50%);color:var(--poem-color);font-family:Georgia,"Times New Roman",serif;font-size:clamp(18px,1.42vw,25px);font-style:italic;font-weight:400;line-height:1.78;letter-spacing:.025em;white-space:nowrap;text-align:left;opacity:.72;text-shadow:0 0 8px rgba(184,137,98,.08);pointer-events:none;user-select:text}
.poem-text{margin:0;white-space:pre}
.poem-line{display:block;min-height:1.78em}
.poem-char{opacity:0;transition:opacity 180ms ease}
.poem-char.visible{opacity:1}
.poem-year{display:block;margin-top:.65em;text-align:right;font-size:.82em;font-style:normal;letter-spacing:.12em;opacity:0;transition:opacity 800ms ease}
.poem-year.visible{opacity:.72}
.transition-layer{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none;background:#fff;transition:opacity var(--page-transition-time) cubic-bezier(.45,0,.2,1)}
body.leaving .transition-layer{opacity:1}body.leaving .home{opacity:0;filter:blur(2px) brightness(1.05)}
@media(max-aspect-ratio:9/16){.artboard{width:100vw;height:auto;aspect-ratio:9/16;right:0;top:50%;transform:translateY(-50%)}}
@media(max-width:700px){.menu-item{font-size:clamp(14px,3.7vw,20px)}.blog-hotspot{display:block;position:absolute;z-index:30;left:82%;top:72%;width:12%;height:12%;border:0;border-radius:50%;background:transparent;text-decoration:none;-webkit-tap-highlight-color:transparent}.blog-hotspot:focus-visible{outline:1px solid rgba(255,255,255,.28);outline-offset:-6px}.poem{left:4vw;bottom:clamp(8px,1.5vh,18px);top:auto;transform:none;max-width:61vw;font-size:clamp(12px,3.35vw,17px);line-height:1.70;letter-spacing:.01em;white-space:nowrap;opacity:.72}.poem-line{min-height:1.70em}.poem-year{margin-top:.55em}}
@media(prefers-reduced-motion:reduce){.menu-item{animation:none}.menu-item{opacity:.80}.home,.transition-layer{transition-duration:.25s}.poem-char{opacity:1;transition:none}.poem-year{opacity:.72;transition:none}}

/* Sparse, non-interactive light drifting above the artwork. */
.light-dust{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none;contain:strict}
.light-dust span{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:#fff0cf;box-shadow:0 0 5px 1px #edb76b80;opacity:0;animation:lightDrift var(--duration) var(--delay) linear infinite;will-change:transform,opacity}
@keyframes lightDrift{
0%{transform:translate3d(0,0,0);opacity:0}
18%{opacity:var(--glow)}
42%{transform:translate3d(var(--mx),var(--my),0);opacity:calc(var(--glow) * .45)}
62%{opacity:var(--glow)}
100%{transform:translate3d(var(--dx),var(--dy),0);opacity:0}
}
@media(prefers-reduced-motion:reduce){.light-dust{display:none}.light-dust span{animation:none}}


/* A soft local flare, without the browser's rectangular touch highlight. */
.menu-item{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.menu-item.is-flashing{animation:none;opacity:1;text-shadow:0 0 6px #fff5dc,0 0 18px #ffd394,0 0 35px #edb76b}
.string-flash{position:fixed;z-index:90;pointer-events:none;width:150px;height:260px;border-radius:50%;opacity:0;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,249,226,.85) 0%,rgba(255,221,166,.4) 14%,rgba(234,178,101,.16) 36%,rgba(234,178,101,0) 70%);mix-blend-mode:screen}
.string-flash.is-active{animation:stringFlare .85s ease-out both}
@keyframes stringFlare{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
@media(prefers-reduced-motion:reduce){.string-flash.is-active{animation:none;opacity:.35}.menu-item.is-flashing{text-shadow:0 0 8px #ffd394}}

<body>

<div class="light-dust" data-scene="home" aria-hidden="true"></div>
<div class="velvet-background" aria-hidden="true"></div>

</main>
<div class="string-flash" id="stringFlash" aria-hidden="true"></div>
<div class="transition-layer" id="transitionLayer" aria-hidden="true"></div>
<script>
(()=>{
const poemCollection=[{lines:["Время стирает всё","Обиды. Слова и даты","Стирает друзей. Дебаты","Одноклассников имена","И ветра шёпот стирает","Любимых песен строки","Морские стирает закаты",".....","Не трогает лишь боль утраты."],year:"2026"}];
const currentPoem=poemCollection[0];
const poemText=document.getElementById("poemText");
const poemYear=document.getElementById("poemYear");
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const lineElements=currentPoem.lines.map(lineText=>{const line=document.createElement("span");line.className="poem-line";const chars=[...lineText].map(character=>{const span=document.createElement("span");span.className="poem-char";span.textContent=character;line.appendChild(span);return span});poemText.appendChild(line);return{line,chars}});
poemYear.textContent=currentPoem.year;
function characterDelay(character){if(character===",")return 380;if(character==="."||character==="!"||character==="?")return 650;if(character===" ")return 60;return 95}
const phrasePauses={
"Время":1000,
"Время стирает всё":2000,
"Обиды.":1000,
"Обиды. Слова и даты":2000,
"Стирает друзей.":500,
"Стирает друзей. Дебаты":2000,
"Одноклассников имена":2000,
"И ветра":500,
"И ветра шёпот":500,
"И ветра шёпот стирает":2000,
"Любимых песен строки":2000,
"Морские стирает":500,
"Морские стирает закаты":0,
"Не трогает лишь боль":500,
"Не трогает лишь боль утраты.":2000
};
async function revealLine(lineText,lineData){let visibleText="";for(let index=0;index<lineData.chars.length;index++){const span=lineData.chars[index];const character=span.textContent;span.classList.add("visible");visibleText+=character;if(lineText==="....."){await sleep(1000);continue}await sleep(characterDelay(character));if(phrasePauses[visibleText]!==undefined)await sleep(phrasePauses[visibleText])}}
async function revealPoem(){
if(reducedMotion){lineElements.forEach(item=>item.chars.forEach(span=>span.classList.add("visible")));poemYear.classList.add("visible");return}
await sleep(7000);
for(let lineIndex=0;lineIndex<currentPoem.lines.length;lineIndex++)await revealLine(currentPoem.lines[lineIndex],lineElements[lineIndex]);
poemYear.classList.add("visible")}
revealPoem();
const links=document.querySelectorAll(".menu-item,.blog-hotspot");
const transitionLayer=document.getElementById("transitionLayer");
const stringFlash=document.getElementById("stringFlash");
let transitionStarted=false;
let navigationTimer;
links.forEach(link=>link.addEventListener("click",event=>{
    if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;
    event.preventDefault();
    if(transitionStarted)return;
    transitionStarted=true;
    const destination=link.href;
    const stringLink=link.classList.contains("menu-item");
    const motionReduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(stringLink){
        const bounds=link.getBoundingClientRect();
        stringFlash.style.left=(bounds.left+bounds.width/2)+"px";
        stringFlash.style.top=(bounds.top+bounds.height/2)+"px";
        stringFlash.style.height=Math.max(220,bounds.height+100)+"px";
        link.classList.add("is-flashing");
        stringFlash.classList.add("is-active");
    }else{
        transitionLayer.style.backgroundColor=link.dataset.color||"#160d0a";
        document.body.classList.add("leaving");
    }
    navigationTimer=window.setTimeout(()=>{
        window.location.href=destination;
    },motionReduced?150:(stringLink?850:2000));
}));
window.addEventListener("pageshow",()=>{
    window.clearTimeout(navigationTimer);
    transitionStarted=false;
    document.body.classList.remove("leaving");
    transitionLayer.style.backgroundColor="";
    stringFlash.classList.remove("is-active");
    links.forEach(link=>link.classList.remove("is-flashing"));
});
})();
</script>

<script>
(() => {
    const layer = document.querySelector('.light-dust');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const home = layer.dataset.scene === 'home';
    const between = (min, max) => min + Math.random() * (max - min);
    function setup() {
        layer.replaceChildren();
        if (motion.matches) return;
        for (let i = 0; i < (home ? 24 : 20); i++) {
            const spark = document.createElement('span');
            const x = home ? between(76, 100) : between(2, 98);
            const y = between(-2, 8);
            const dx = home ? between(43, 57) - x : between(-9, 9);
            const dy = home ? between(37, 51) - y : between(9, 23);
            const values = {
                x: x + '%', y: y + '%', size: between(1, 2.5) + 'px',
                mx: (dx * .45 + between(-3, 3)) + 'vw',
                my: (dy * .4 + between(-2, 2)) + 'vh',
                dx: dx + 'vw', dy: dy + 'vh',
                duration: between(13, 24) + 's', delay: -between(0, 24) + 's',
                glow: between(.25, .65)
            };
            Object.entries(values).forEach(([key, value]) => spark.style.setProperty('--' + key, value));
            layer.appendChild(spark);
        }
        pauseWhenHidden();
    }
    function pauseWhenHidden() {
        layer.querySelectorAll('span').forEach(spark => {
            spark.style.animationPlayState = document.hidden ? 'paused' : 'running';
        });
    }
    document.addEventListener('visibilitychange', pauseWhenHidden);
    motion.addEventListener('change', setup);
    setup();
})();
</script>
