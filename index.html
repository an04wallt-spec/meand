<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>me/and.ru</title>

<style>

    /* =========================================================
       ГЛОБАЛЬНЫЕ НАСТРОЙКИ
       ========================================================= */

    :root {

        /* Длительность превращения одной страницы в другую */
        --transition-time: 2s;

        /* Общий ритм "дыхания" */
        --breath-time: 5.5s;

        /*
           Базовый цвет главной страницы.
           Он виден до загрузки фонового изображения.
        */
        --main-brown: #241006;
    }


    * {
        box-sizing: border-box;
    }


    html,
    body {
        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;

        overflow: hidden;

        background: var(--main-brown);
    }


    body {
        font-family:
            Georgia,
            "Times New Roman",
            serif;
    }


    /* =========================================================
       ГЛАВНАЯ СЦЕНА
       ========================================================= */

    .home {

        position: fixed;
        inset: 0;

        overflow: hidden;

        background-color: var(--main-brown);

        background-image:
            url("main-bg.png");

        background-repeat:
            no-repeat;

        /*
           Изображение никогда не растягивается
           с нарушением пропорций.
        */
        background-size:
            cover;

        /*
           Гитарная композиция удерживается справа.
        */
        background-position:
            center right;

        opacity: 1;

        transition:
            opacity var(--transition-time)
                cubic-bezier(.45, 0, .2, 1),

            filter var(--transition-time)
                cubic-bezier(.45, 0, .2, 1);

    }


    /* =========================================================
       ЛЁГКАЯ АТМОСФЕРНАЯ ВУАЛЬ
       ========================================================= */

    .home::after {

        content: "";

        position: absolute;
        inset: 0;

        z-index: 2;

        pointer-events: none;

        background:

            radial-gradient(
                circle at 88% 5%,
                rgba(255, 174, 87, .025),
                transparent 32%
            ),

            linear-gradient(
                90deg,
                rgba(0, 0, 0, .035),
                transparent 55%
            );

    }


    /* =========================================================
       ЛОГОТИП
       ========================================================= */

    .logo {

        position: absolute;

        /*
           Положение логотипа.
        */

        left:
            clamp(26px, 5vw, 100px);

        top:
            clamp(28px, 5vh, 85px);


        /*
           Размер логотипа адаптивный,
           но ограничен сверху и снизу.
        */

        width:
            clamp(80px, 10vw, 165px);


        z-index: 20;

        opacity: .08;

        user-select: none;

        pointer-events: none;


        animation:

            logoBreath
            var(--breath-time)
            ease-in-out
            infinite;

    }


    .logo img {

        display: block;

        width: 100%;
        height: auto;

    }


    /* =========================================================
       НАВИГАЦИЯ
       ========================================================= */

    .string-menu {

        position: absolute;

        inset: 0;

        z-index: 15;

        pointer-events: none;

    }


    /* =========================================================
       ОБЩИЙ СТИЛЬ ВСЕХ ПЯТИ НАДПИСЕЙ
       ========================================================= */

    .menu-item {

        position: absolute;

        /*
           Вертикальное расположение текста.
        */

        writing-mode: vertical-rl;


        /*
           ВАЖНО:

           rotate(180deg)

           разворачивает направление текста.

           Теперь слова читаются
           СНИЗУ ВВЕРХ.
        */

        transform:
            translateX(50%)
            rotate(180deg);


        transform-origin:
            center center;


        color:
            #ffffff;


        font-size:
            clamp(18px, 1.55vw, 30px);


        font-weight:
            400;


        line-height:
            1;


        letter-spacing:
            .10em;


        white-space:
            nowrap;


        text-decoration:
            none;


        /*
           В спокойной фазе надпись
           почти растворяется.
        */

        opacity:
            .10;


        text-shadow:

            0 0 3px
            rgba(255,255,255,.05);


        /*
           Ссылка кликабельна,
           несмотря на pointer-events:none
           у родительского nav.
        */

        pointer-events:
            auto;


        cursor:
            pointer;


        user-select:
            none;


        animation:

            textBreath
            var(--breath-time)
            ease-in-out
            infinite;


        transition:

            opacity .35s ease,

            text-shadow .35s ease;

    }


    /* =========================================================
       ПОЛОЖЕНИЕ ПУНКТОВ
       =========================================================

       Здесь каждый пункт позиционируется ОТДЕЛЬНО.

       Это сделано специально.

       Теперь мы можем точно совместить каждое слово
       с конкретной струной main-bg.png,
       не меняя остальные элементы.
       ========================================================= */


    /* -------------------------
       МЕБЕЛЬ
       ------------------------- */

    .menu-furniture {

        right:
            28.1%;

        top:
            16.0%;

    }


    /* -------------------------
       СКРИПТЫ
       ------------------------- */

    .menu-scripts {

        right:
            21.3%;

        top:
            20.0%;

    }


    /* -------------------------
       РАЗНОЕ
       ------------------------- */

    .menu-other {

        right:
            14.9%;

        top:
            24.0%;

    }


    /* -------------------------
       ПРОЗА
       ------------------------- */

    .menu-prose {

        right:
            9.0%;

        top:
            28.0%;

    }


    /* -------------------------
       ТЕКСТЫ
       ------------------------- */

    .menu-texts {

        right:
            3.5%;

        top:
            32.0%;

    }


    /* =========================================================
       НАВЕДЕНИЕ МЫШИ
       ========================================================= */

    .menu-item:hover {

        opacity:
            1 !important;

        text-shadow:

            0 0 7px
            rgba(255,255,255,.75),

            0 0 20px
            rgba(255,245,230,.32);

    }


    /* =========================================================
       КЛАВИАТУРНАЯ НАВИГАЦИЯ
       ========================================================= */

    .menu-item:focus-visible {

        outline:
            none;

        opacity:
            1 !important;

        text-shadow:

            0 0 8px
            rgba(255,255,255,.85),

            0 0 22px
            rgba(255,245,230,.40);

    }


    /* =========================================================
       ДЫХАНИЕ ТЕКСТА
       ========================================================= */

    @keyframes textBreath {

        0%,
        100% {

            opacity:
                .08;

            text-shadow:

                0 0 3px
                rgba(255,255,255,.04);

        }


        50% {

            opacity:
                1;

            text-shadow:

                0 0 7px
                rgba(255,255,255,.55),

                0 0 20px
                rgba(255,240,220,.24);

        }

    }


    /* =========================================================
       ДЫХАНИЕ ЛОГОТИПА
       ========================================================= */

    @keyframes logoBreath {

        0%,
        100% {

            opacity:
                .035;

        }


        50% {

            opacity:
                .27;

        }

    }


    /* =========================================================
       СЛОЙ ПЕРЕХОДА
       ========================================================= */

    .transition-layer {

        position: fixed;

        inset: 0;

        z-index: 100;

        pointer-events: none;


        /*
           Цвет меняется JavaScript'ом
           в зависимости от выбранного раздела.
        */

        background:
            #ffffff;


        opacity:
            0;


        transition:

            opacity
            var(--transition-time)
            cubic-bezier(.45, 0, .2, 1);

    }


    /* =========================================================
       СОСТОЯНИЕ УХОДА С ГЛАВНОЙ
       ========================================================= */

    body.leaving
    .transition-layer {

        opacity:
            1;

    }


    body.leaving
    .home {

        opacity:
            0;

        filter:
            blur(2px)
            brightness(1.08);

    }


    /*
       При начале перехода запрещаем
       повторные клики.
    */

    body.leaving
    .string-menu {

        pointer-events:
            none;

    }


    /* =========================================================
       ВЕРТИКАЛЬНЫЙ СМАРТФОН
       ========================================================= */

    @media
    (max-width: 700px) {


        .home {

            /*
               Для вертикального изображения
               сохраняем правую часть композиции.
            */

            background-position:
                center right;

        }


        .logo {

            left:
                5.5vw;

            top:
                4vh;

            width:
                clamp(
                    68px,
                    19vw,
                    110px
                );

        }


        .menu-item {

            font-size:
                clamp(
                    15px,
                    4.0vw,
                    20px
                );

        }


        /*
           На телефоне позиции привязываются
           к пропорциям экрана.
        */


        .menu-furniture {

            right:
                28.0%;

            top:
                16%;

        }


        .menu-scripts {

            right:
                21.3%;

            top:
                20%;

        }


        .menu-other {

            right:
                14.8%;

            top:
                24%;

        }


        .menu-prose {

            right:
                8.9%;

            top:
                28%;

        }


        .menu-texts {

            right:
                3.4%;

            top:
                32%;

        }

    }


    /* =========================================================
       ГОРИЗОНТАЛЬНЫЕ МОНИТОРЫ
       ========================================================= */

    @media
    (min-aspect-ratio: 4/3) {


        /*
           На широком мониторе фон продолжает
           держаться за правую границу.

           Поэтому гитарная часть не переезжает
           в центр страницы.
        */

        .home {

            background-position:
                center right;

        }

    }


    /* =========================================================
       ОЧЕНЬ ШИРОКИЕ МОНИТОРЫ
       ========================================================= */

    @media
    (min-aspect-ratio: 2/1) {

        .logo {

            width:
                clamp(
                    100px,
                    8vw,
                    170px
                );

        }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {


        .logo,
        .menu-item {

            animation:
                none;

        }


        .menu-item {

            opacity:
                .82;

        }


        .logo {

            opacity:
                .16;

        }


        .home,
        .transition-layer {

            transition-duration:
                .25s;

        }

    }

</style>
</head>


<body>


<!-- =========================================================
     ГЛАВНАЯ СТРАНИЦА
     ========================================================= -->

<main
    class="home"
    id="home"
>


    <!-- =====================================================
         ЛОГОТИП

         Отдельный PNG-слой.
         В main-bg.png логотипа нет.
         ===================================================== -->

    <div class="logo">

        <img
            src="logo.png"
            alt=""
            draggable="false"
        >

    </div>



    <!-- =====================================================
         ОСНОВНАЯ НАВИГАЦИЯ
         ===================================================== -->

    <nav
        class="string-menu"
        aria-label="Основные разделы"
    >


        <!-- МЕБЕЛЬ -->

        <a
            class="
                menu-item
                menu-furniture
            "

            href="furniture.html"

            data-color="#ffffff"
        >
            Мебель
        </a>



        <!-- СКРИПТЫ -->

        <a
            class="
                menu-item
                menu-scripts
            "

            href="scripts.html"

            data-color="#18382b"
        >
            Скрипты
        </a>



        <!-- РАЗНОЕ -->

        <a
            class="
                menu-item
                menu-other
            "

            href="other.html"

            data-color="#d8d0c4"
        >
            Разное
        </a>



        <!-- ПРОЗА -->

        <a
            class="
                menu-item
                menu-prose
            "

            href="prose.html"

            data-color="#332d2a"
        >
            Проза
        </a>



        <!-- ТЕКСТЫ -->

        <a
            class="
                menu-item
                menu-texts
            "

            href="texts.html"

            data-color="#292929"
        >
            Тексты
        </a>


    </nav>

</main>



<!-- =========================================================
     ПЕРЕХОДНЫЙ СЛОЙ

     Именно он создаёт эффект превращения
     коричневой главной страницы
     в цвет следующего раздела.
     ========================================================= -->

<div
    class="transition-layer"
    id="transitionLayer"
    aria-hidden="true"
></div>



<script>

(() => {


    /* =====================================================
       ОСНОВНЫЕ ЭЛЕМЕНТЫ
       ===================================================== */


    const links =
        document.querySelectorAll(
            ".menu-item"
        );


    const transitionLayer =
        document.getElementById(
            "transitionLayer"
        );


    let transitionStarted =
        false;



    /* =====================================================
       ПЕРЕХОД ПО РАЗДЕЛАМ
       ===================================================== */


    links.forEach(link => {


        link.addEventListener(
            "click",
            event => {


                /*
                   Ctrl + click
                   Cmd + click
                   Shift + click
                   Alt + click

                   оставляем браузеру,
                   чтобы работало открытие
                   в новой вкладке.
                */


                if (

                    event.ctrlKey ||

                    event.metaKey ||

                    event.shiftKey ||

                    event.altKey

                ) {

                    return;

                }



                event.preventDefault();



                /*
                   Не позволяем запустить
                   переход дважды.
                */

                if (
                    transitionStarted
                ) {

                    return;

                }


                transitionStarted =
                    true;



                /* Адрес страницы */

                const destination =
                    link.href;



                /*
                   Цвет страницы,
                   в которую превращается
                   главная.
                */

                const targetColor =
                    link.dataset.color
                    ||
                    "#ffffff";



                /*
                   Устанавливаем цвет
                   переходного слоя.
                */

                transitionLayer.style.background =
                    targetColor;



                /*
                   Запускаем растворение.
                */

                requestAnimationFrame(
                    () => {

                        document.body
                            .classList
                            .add(
                                "leaving"
                            );

                    }
                );



                /*
                   После завершения
                   двухсекундной анимации
                   открываем раздел.
                */

                window.setTimeout(
                    () => {

                        window.location.href =
                            destination;

                    },

                    2000
                );


            }
        );


    });



    /* =====================================================
       ВОЗВРАТ НАЗАД
       =====================================================

       Некоторые браузеры сохраняют страницу
       целиком в BFCache.

       Если пользователь ушёл в раздел,
       а потом нажал "Назад",
       браузер может восстановить index
       в состоянии leaving.

       Поэтому состояние обязательно
       сбрасываем.
       ===================================================== */


    window.addEventListener(
        "pageshow",
        () => {


            transitionStarted =
                false;


            document.body
                .classList
                .remove(
                    "leaving"
                );


            transitionLayer.style.opacity =
                "";


        }
    );


})();

</script>


</body>
</html>
