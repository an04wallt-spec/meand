<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>me/and.ru</title>

<style>

    /* =========================================================
       ОСНОВНЫЕ ПАРАМЕТРЫ
       ========================================================= */

    :root {

        /*
           Тон взят из самого тёмного участка
           внутри отверстия гитары.
        */

        --brown-dark: #140c08;

        --breath-time: 5.5s;
        --page-transition-time: 2s;

    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        height: 100%;

        margin: 0;
        padding: 0;

        overflow: hidden;

        background: var(--brown-dark);

    }


    body {

        font-family:
            Georgia,
            "Times New Roman",
            serif;

    }


    /* =========================================================
       ГЛАВНАЯ СЦЕНА
       ========================================================= */

    .home {

        position: fixed;

        inset: 0;

        overflow: hidden;

        background:
            var(--brown-dark);

        opacity: 1;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1),

            filter
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }


    /* =========================================================
       ОСНОВНАЯ БАРХАТНАЯ СРЕДА

       Теперь вся свободная область строится
       вокруг #140c08.

       Здесь больше нет красной/рыжей заливки,
       которая была видна на прошлом скриншоте.
       ========================================================= */

    .velvet-background {

        position: absolute;

        inset: 0;

        z-index: 0;

        background:

            radial-gradient(
                ellipse 75% 105%
                at 82% 45%,

                rgba(40, 22, 13, .20) 0%,

                rgba(27, 15, 10, .12) 37%,

                rgba(20, 12, 8, 0) 72%
            ),

            linear-gradient(
                90deg,

                #140c08 0%,

                #140c08 48%,

                #160d09 72%,

                #180f0a 100%
            );

    }


    /*
       Очень лёгкая виньетка.

       Она нужна только для глубины.
       Цвет среды практически не меняет.
    */

    .velvet-background::before {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            radial-gradient(
                ellipse at center,

                transparent 45%,

                rgba(0,0,0,.10) 100%
            );

    }


    /*
       Едва заметное тепло справа.

       Оно помогает общей заливке естественно
       войти в область изображения.
    */

    .velvet-background::after {

        content: "";

        position: absolute;

        inset: 0;

        pointer-events: none;

        background:

            radial-gradient(
                ellipse 35% 70%
                at 100% 12%,

                rgba(91, 47, 25, .055),

                transparent 75%
            );

    }


    /* =========================================================
       ARTBOARD

       Изображение и надписи живут
       в одной системе координат.
       ========================================================= */

    .artboard {

        position: absolute;

        z-index: 5;

        right: 0;

        top: 50%;

        height: 100vh;
        height: 100dvh;

        aspect-ratio: 9 / 16;

        transform:
            translateY(-50%);

        overflow: visible;

    }


    /* =========================================================
       ИЗОБРАЖЕНИЕ
       ========================================================= */

    .artwork {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;

        user-select: none;


        /*
           Эту прозрачность оставляем:
           по текущему результату она уже подходит.
        */

        opacity: .82;


        /*
           Сохраняем приглушённый характер изображения.
        */

        filter:

            brightness(.84)
            saturate(.82)
            contrast(.94);


        /*
           Растворение левой части картинки.
        */

        -webkit-mask-image:

            linear-gradient(
                to right,

                transparent 0%,

                rgba(0,0,0,.06) 5%,

                rgba(0,0,0,.22) 13%,

                rgba(0,0,0,.50) 23%,

                rgba(0,0,0,.78) 34%,

                rgba(0,0,0,.94) 44%,

                #000 53%,

                #000 100%
            );


        mask-image:

            linear-gradient(
                to right,

                transparent 0%,

                rgba(0,0,0,.06) 5%,

                rgba(0,0,0,.22) 13%,

                rgba(0,0,0,.50) 23%,

                rgba(0,0,0,.78) 34%,

                rgba(0,0,0,.94) 44%,

                #000 53%,

                #000 100%
            );

    }


    /* =========================================================
       МЯГКОЕ СЛИЯНИЕ С ФОНОМ
       ========================================================= */

    .artboard::after {

        content: "";

        position: absolute;

        inset: 0;

        z-index: 10;

        pointer-events: none;

        background:

            linear-gradient(
                90deg,

                rgba(20,12,8,.90) 0%,

                rgba(20,12,8,.68) 14%,

                rgba(20,12,8,.38) 27%,

                rgba(20,12,8,.14) 40%,

                rgba(20,12,8,.03) 51%,

                transparent 60%
            );

    }


    /* =========================================================
       НАВИГАЦИЯ
       ========================================================= */

    .string-menu {

        position: absolute;

        inset: 0;

        z-index: 20;

        pointer-events: none;

    }


    .menu-item {

        position: absolute;

        writing-mode:
            vertical-rl;

        /*
           Слова читаются снизу вверх.
        */

        transform:

            translateX(-50%)
            rotate(180deg);

        transform-origin:
            center center;


        color:
            #ffffff;


        font-family:

            Georgia,
            "Times New Roman",
            serif;


        font-size:

            clamp(
                15px,
                2vh,
                30px
            );


        font-weight:
            400;


        line-height:
            1;


        letter-spacing:
            .10em;


        white-space:
            nowrap;


        text-decoration:
            none;


        opacity:
            .08;


        pointer-events:
            auto;


        cursor:
            pointer;


        user-select:
            none;


        text-shadow:

            0 0 3px
            rgba(255,255,255,.04);


        animation:

            textBreath
            var(--breath-time)
            ease-in-out
            infinite;


        transition:

            opacity .35s ease,

            text-shadow .35s ease;

    }


    /* =========================================================
       ТОЧНЫЕ ОСИ ПЯТИ СТРУН

       Эти значения подогнаны по текущему скриншоту.

       Надпись теперь ставится ЦЕНТРОМ
       непосредственно на соответствующую струну.
       ========================================================= */


    /* МЕБЕЛЬ — первая видимая струна */

    .menu-furniture {

        left: 58.2%;
        top: 16%;

    }


    /* СКРИПТЫ */

    .menu-scripts {

        left: 66.3%;
        top: 20%;

    }


    /* РАЗНОЕ */

    .menu-other {

        left: 73.8%;
        top: 24%;

    }


    /* ПРОЗА */

    .menu-prose {

        left: 81.5%;
        top: 28%;

    }


    /* ТЕКСТЫ — крайняя правая видимая струна */

    .menu-texts {

        left: 88.6%;
        top: 32%;

    }


    /* =========================================================
       НАВЕДЕНИЕ
       ========================================================= */

    .menu-item:hover,
    .menu-item:focus-visible {

        opacity:
            1 !important;

        outline:
            none;

        text-shadow:

            0 0 7px
            rgba(255,255,255,.75),

            0 0 20px
            rgba(255,240,220,.28);

    }


    /* =========================================================
       ДЫХАНИЕ ТЕКСТА
       ========================================================= */

    @keyframes textBreath {

        0%,
        100% {

            opacity:
                .06;

            text-shadow:

                0 0 2px
                rgba(255,255,255,.025);

        }


        50% {

            opacity:
                1;

            text-shadow:

                0 0 7px
                rgba(255,255,255,.58),

                0 0 20px
                rgba(255,240,220,.24);

        }

    }


    /* =========================================================
       ЛОГОТИП
       ========================================================= */

    .logo {

        position:
            fixed;

        z-index:
            30;


        left:

            clamp(
                24px,
                4vw,
                80px
            );


        top:

            clamp(
                24px,
                5vh,
                75px
            );


        width:

            clamp(
                75px,
                9vw,
                155px
            );


        opacity:
            .04;


        pointer-events:
            none;


        user-select:
            none;


        animation:

            logoBreath
            var(--breath-time)
            ease-in-out
            infinite;

    }


    .logo img {

        display:
            block;

        width:
            100%;

        height:
            auto;

    }


    @keyframes logoBreath {

        0%,
        100% {

            opacity:
                .035;

        }


        50% {

            opacity:
                .27;

        }

    }


    /* =========================================================
       ПЕРЕХОД НА ДРУГУЮ СТРАНИЦУ
       ========================================================= */

    .transition-layer {

        position:
            fixed;

        inset:
            0;

        z-index:
            100;

        opacity:
            0;

        pointer-events:
            none;

        background:
            #ffffff;

        transition:

            opacity
            var(--page-transition-time)
            cubic-bezier(.45,0,.2,1);

    }


    body.leaving
    .transition-layer {

        opacity:
            1;

    }


    body.leaving
    .home {

        opacity:
            0;

        filter:

            blur(2px)
            brightness(1.05);

    }


    body.leaving
    .logo {

        opacity:
            0;

    }


    /* =========================================================
       ОЧЕНЬ УЗКИЕ ВЕРТИКАЛЬНЫЕ ЭКРАНЫ
       ========================================================= */

    @media
    (max-aspect-ratio: 9/16) {

        .artboard {

            width:
                100vw;

            height:
                auto;

            aspect-ratio:
                9 / 16;

            right:
                0;

            top:
                50%;

            transform:
                translateY(-50%);

        }

    }


    /* =========================================================
       СМАРТФОН
       ========================================================= */

    @media
    (max-width: 700px) {

        .logo {

            left:
                5vw;

            top:
                4vh;

            width:

                clamp(
                    68px,
                    19vw,
                    105px
                );

        }


        .menu-item {

            font-size:

                clamp(
                    14px,
                    3.7vw,
                    20px
                );

        }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

        .menu-item,
        .logo {

            animation:
                none;

        }


        .menu-item {

            opacity:
                .80;

        }


        .logo {

            opacity:
                .16;

        }


        .home,
        .transition-layer {

            transition-duration:
                .25s;

        }

    }

</style>
</head>


<body>


<!-- =========================================================
     ГЛАВНАЯ
     ========================================================= -->

<main
    class="home"
    id="home"
>


    <!-- БАРХАТНАЯ СРЕДА -->

    <div
        class="velvet-background"
        aria-hidden="true"
    ></div>



    <!-- =====================================================
         ЕДИНАЯ КОМПОЗИЦИОННАЯ ПЛОСКОСТЬ
         ===================================================== -->

    <div
        class="artboard"
    >


        <!-- ЭТАЛОННОЕ ИЗОБРАЖЕНИЕ -->

        <img
            class="artwork"
            src="main-bg.png"
            alt=""
            draggable="false"
        >



        <!-- НАВИГАЦИЯ -->

        <nav
            class="string-menu"
            aria-label="Основные разделы"
        >


            <a
                class="menu-item menu-furniture"
                href="furniture.html"
                data-color="#ffffff"
            >
                Мебель
            </a>


            <a
                class="menu-item menu-scripts"
                href="scripts.html"
                data-color="#18382b"
            >
                Скрипты
            </a>


            <a
                class="menu-item menu-other"
                href="other.html"
                data-color="#d8d0c4"
            >
                Разное
            </a>


            <a
                class="menu-item menu-prose"
                href="prose.html"
                data-color="#332d2a"
            >
                Проза
            </a>


            <a
                class="menu-item menu-texts"
                href="texts.html"
                data-color="#292929"
            >
                Тексты
            </a>


        </nav>


    </div>



    <!-- =====================================================
         ЛОГОТИП
         ===================================================== -->

    <div
        class="logo"
    >

        <img
            src="logo.png"
            alt=""
            draggable="false"
        >

    </div>


</main>



<!-- =========================================================
     ПЕРЕХОДНЫЙ СЛОЙ
     ========================================================= -->

<div
    class="transition-layer"
    id="transitionLayer"
    aria-hidden="true"
></div>



<script>

(() => {


    const links =
        document.querySelectorAll(
            ".menu-item"
        );


    const transitionLayer =
        document.getElementById(
            "transitionLayer"
        );


    let transitionStarted =
        false;



    /* =====================================================
       ПЕРЕХОДЫ
       ===================================================== */

    links.forEach(link => {


        link.addEventListener(
            "click",
            event => {


                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.altKey
                ) {

                    return;

                }


                event.preventDefault();


                if (
                    transitionStarted
                ) {

                    return;

                }


                transitionStarted =
                    true;



                const destination =
                    link.href;


                const targetColor =
                    link.dataset.color
                    ||
                    "#ffffff";



                transitionLayer
                    .style
                    .backgroundColor =
                    targetColor;



                requestAnimationFrame(
                    () => {

                        document
                            .body
                            .classList
                            .add(
                                "leaving"
                            );

                    }
                );



                window.setTimeout(
                    () => {

                        window.location.href =
                            destination;

                    },

                    2000
                );


            }
        );


    });



    /* =====================================================
       ВОЗВРАТ КНОПКОЙ НАЗАД
       ===================================================== */

    window.addEventListener(
        "pageshow",
        () => {


            transitionStarted =
                false;


            document
                .body
                .classList
                .remove(
                    "leaving"
                );


            transitionLayer
                .style
                .backgroundColor =
                "";

        }
    );


})();

</script>


</body>
</html>
